<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eefb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1828" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petal Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}</style>
<title>Petal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: a planner binder. Month rings across the top, section tabs below, one paper page at a time. */
:root{
  --bg:#f3eefb; --paper:#fffdff; --line:#e4daf3; --lilac:#cdb9ec; --lilac-soft:#ece3f8;
  --accent:#8a6cc7; --accent-ink:#ffffff; --ink:#3f3158; --muted:#7c6f94; --rose:#e9a8c4; --rose-soft:#f8e1ec;
  --mint:#a9dcc8; --sky:#b9cdf2; --petal:#f6c9dc; --petal-deep:#e79bbd; --branch:#8b6a7e;
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1828; --paper:#28223a; --line:#3d3455; --lilac:#7d68a8; --lilac-soft:#352c4c;
  --accent:#b9a0ee; --accent-ink:#1d1828; --ink:#efe8fb; --muted:#ab9fc4; --rose:#c9799d; --rose-soft:#4a2f42;
  --mint:#5f9b85; --sky:#6a83b8; --petal:#d993b6; --petal-deep:#f0b5d0; --branch:#b48fa6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1828; --paper:#28223a; --line:#3d3455; --lilac:#7d68a8; --lilac-soft:#352c4c;
  --accent:#b9a0ee; --accent-ink:#1d1828; --ink:#efe8fb; --muted:#ab9fc4; --rose:#c9799d; --rose-soft:#4a2f42;
  --mint:#5f9b85; --sky:#6a83b8; --petal:#d993b6; --petal-deep:#f0b5d0; --branch:#b48fa6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:1.7rem;letter-spacing:.01em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sub{color:var(--muted);font-size:.9rem}
.status{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.months button{flex:0 0 auto;min-width:44px;font:600 .85rem var(--f-body);border:1.5px solid var(--lilac);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:-1px;position:relative;z-index:1}
.tabs button{font:500 .92rem var(--f-display);border:1.5px solid var(--line);border-bottom:none;background:var(--lilac-soft);color:var(--muted);border-radius:12px 12px 0 0;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--lilac)}
.page{background:var(--paper);border:1.5px solid var(--lilac);border-radius:0 var(--r) var(--r) var(--r);padding:22px;min-height:420px}
@media (max-width:560px){.page{padding:16px;border-radius:0 0 var(--r) var(--r)} .tabs button{padding:7px 10px;font-size:.85rem}}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:16px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
textarea{width:100%;resize:vertical}
input.name-in{font:500 1.35rem var(--f-display);border:none;border-bottom:2px dashed var(--lilac);border-radius:0;padding:2px 2px;width:min(260px,100%);background:transparent}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.88rem;color:var(--muted)}
.btn{font:600 .88rem var(--f-body);background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:8px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:4px 10px;font-size:.8rem}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--ink);background:var(--lilac-soft)}
/* calendar */
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:4px;min-width:660px}
.dow{font:600 .75rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cell{background:var(--bg);border-radius:10px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:2px}
.cell.blank{background:transparent;border:1.5px dashed var(--line)}
.cell .num{font:500 .95rem var(--f-display);color:var(--accent)}
.cell textarea{flex:1;border:none;background:transparent;padding:0;font-size:.8rem;resize:none;line-height:1.35}
.cal-notes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media (max-width:700px){.cal-notes{grid-template-columns:1fr}}
/* period */
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.pdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pday{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);font:600 .85rem var(--f-body);cursor:pointer;display:grid;place-items:center;padding:0}
.pday[data-l="1"]{background:var(--rose-soft);border-color:var(--rose)}
.pday[data-l="2"]{background:color-mix(in srgb,var(--rose) 45%,var(--paper));border-color:var(--rose)}
.pday[data-l="3"]{background:color-mix(in srgb,var(--rose) 75%,var(--paper));border-color:var(--rose)}
.pday[data-l="4"]{background:var(--rose);border-color:var(--rose);color:#3a1d2c}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rose);display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .82rem var(--f-body);border:1.5px solid var(--lilac);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac)}
.card{background:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row .field{flex:1 1 120px}
.predict{font:500 1rem var(--f-display);color:var(--ink)}
/* doodle */
.doodle-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.canvas-box{background:#fffdfd;border:1.5px dashed var(--lilac);border-radius:var(--r);overflow:hidden;touch-action:none;aspect-ratio:10/7;max-width:100%}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
.quote{margin-top:18px;text-align:center;padding:14px 10px 4px;border-top:1.5px dashed var(--lilac)}
.quote p{font:700 1.75rem/1.2 var(--f-hand);margin:0;color:var(--accent);text-wrap:balance}
.quote small{display:block;color:var(--muted);margin-top:4px;font-size:.85rem}
/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.item input[type=text]{flex:1;border:none;background:transparent;padding:2px 0}
.item.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.check{appearance:none;width:22px;height:22px;flex:0 0 22px;border:2px solid var(--accent);border-radius:7px;background:var(--paper);cursor:pointer;display:grid;place-items:center;margin:0}
.check:checked{background:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.idx{font:500 .9rem var(--f-display);color:var(--accent);width:22px;text-align:right;flex:0 0 22px}
.progress{height:12px;border-radius:999px;background:var(--lilac-soft);overflow:hidden}
.progress>div{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
@media (prefers-reduced-motion:reduce){.progress>div{transition:none}}
.grid2>.reward{align-self:start}
.reward{border:2px dashed var(--lilac);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.reward.won{border-style:solid;border-color:var(--accent);background:var(--lilac-soft)}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas button{font:600 .8rem var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.ideas button:hover{border-color:var(--accent)}
.empty{color:var(--muted);font-size:.9rem;padding:10px 2px}
/* money */
.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:640px){.totals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tot{background:var(--bg);border-radius:12px;padding:10px 12px}
.tot b{display:block;font:500 1.3rem var(--f-display);font-variant-numeric:tabular-nums}
.tot.neg b{color:#c0567f}
.money-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.money-cols{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:6px;align-items:center}
.mrow.bill{grid-template-columns:22px minmax(0,1fr) 46px 76px auto}
.mrow input{width:100%;padding:5px 8px;font-size:.88rem}
.mrow input.amt{text-align:right;font-variant-numeric:tabular-nums}
.colhead{display:flex;justify-content:space-between;align-items:baseline}
.colhead span{font-variant-numeric:tabular-nums;font-weight:700}
.mini{font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
/* fitness */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.fday{background:var(--bg);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;border:1.5px solid transparent}
.fday.on{border-color:var(--accent);background:var(--lilac-soft)}
.fday .top2{display:flex;justify-content:space-between;align-items:center}
.fday .num{font:500 .95rem var(--f-display);color:var(--accent)}
.fday select,.fday input{font-size:.75rem;padding:2px 4px;border-radius:6px;width:100%}
.milestones{display:flex;flex-direction:column;gap:10px}
.ms{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--lilac)}
.ms.won{border-style:solid;border-color:var(--accent);background:var(--lilac-soft)}
.ms .badge{font:600 .85rem var(--f-display);width:54px;flex:0 0 54px;text-align:center;color:var(--accent)}
.ms input{flex:1}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* cherry blossoms */
body{background-image:radial-gradient(circle at 8% 12%,color-mix(in srgb,var(--petal) 22%,transparent) 0 120px,transparent 260px),radial-gradient(circle at 92% 88%,color-mix(in srgb,var(--lilac) 30%,transparent) 0 140px,transparent 320px);background-attachment:fixed}
.top{position:relative;padding-right:250px;min-height:96px;align-items:start;flex-direction:column;justify-content:start}
.branch{position:absolute;right:-6px;top:-18px;width:260px;height:auto;pointer-events:none}
@media (max-width:560px){.top{padding-right:140px}.branch{width:150px;top:-8px;right:-14px}}
[hidden]{display:none!important}
.page{position:relative;overflow:hidden}
.page>*{position:relative;z-index:1}
.page .corner{position:absolute;z-index:0;width:170px;right:-20px;bottom:-24px;opacity:.6;pointer-events:none}
.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petals i{position:absolute;top:-30px;width:14px;height:11px;background:var(--petal);border-radius:12px 1px 12px 1px;opacity:.7;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(120px,110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.petals{display:none}}
.wrap{position:relative;z-index:1}
.eyebrow::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--petal-deep);border-radius:10px 1px 10px 1px;transform:rotate(-20deg)}
.months .short{display:none}
@media (max-width:560px){.months .full{display:none}.months .short{display:inline}}
.mtitle{font-size:1.6rem;color:var(--ink)}
.months button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--petal)}
.quote p{color:var(--petal-deep)}
.quote::before{content:"✿  ❀  ✿";display:block;color:var(--petal-deep);letter-spacing:.3em;margin-bottom:6px;font-size:.9rem}
.cell .num,.fday .num{color:var(--petal-deep)}
.progress>div{background:linear-gradient(90deg,var(--lilac),var(--accent) 60%,var(--petal-deep))}
.reward.won,.ms.won{border-color:var(--petal-deep)}
.garland{display:block;width:min(600px,100%);margin:18px auto 0}
.foot{text-align:center;font:700 1.5rem/1.2 var(--f-hand);color:var(--petal-deep);margin:4px auto 0;max-width:36ch;text-wrap:balance}
.foot-by{text-align:center;color:var(--muted);font-size:.85rem;margin:4px 0 0}
.petals i.fl{width:auto;height:auto;background:none;border-radius:0;color:var(--petal);font-size:18px;opacity:.75}
.tabs button[aria-selected="true"]::before{content:"✿ ";color:var(--petal-deep)}
.photo{margin-bottom:18px;display:flex;flex-direction:column;gap:8px}
.photo-frame{position:relative;border-radius:var(--r);overflow:hidden;border:6px solid var(--lilac-soft);box-shadow:0 0 0 1.5px var(--petal);background:var(--bg);max-height:340px}
.photo-frame img{display:block;width:100%;height:100%;max-height:330px;object-fit:cover}
.photo-frame .pf-bloom{position:absolute;width:70px;pointer-events:none}
.photo-frame .tl{left:-8px;top:-8px}.photo-frame .br{right:-8px;bottom:-8px;transform:rotate(180deg)}
.photo-empty{border:2px dashed var(--petal);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;color:var(--muted);text-align:center;background:color-mix(in srgb,var(--petal) 10%,transparent)}
.photo-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.photo-bar input[type=text]{flex:1 1 200px}
.collage-frame{position:relative;padding:10px;border-radius:var(--r);background:var(--lilac-soft);box-shadow:0 0 0 1.5px var(--petal)}
.collage{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(34px,7.2vw,66px);gap:8px}
.tile{margin:0;position:relative;border-radius:10px;overflow:hidden;background:var(--bg);border:4px solid var(--paper);box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 18%,transparent);transform:rotate(var(--tilt));transition:transform .2s}
.tile:hover{transform:rotate(0) scale(1.02);z-index:2}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.missing{background:repeating-linear-gradient(45deg,var(--lilac-soft) 0 8px,var(--bg) 8px 16px)}
.tile-tools{position:absolute;top:4px;right:4px;display:flex;gap:4px}
.tbtn{width:28px;height:28px;border-radius:50%;border:none;background:color-mix(in srgb,var(--paper) 88%,transparent);color:var(--ink);font-size:.95rem;cursor:pointer;display:grid;place-items:center;padding:0}
.tbtn:hover{background:var(--paper);color:var(--accent)}
@media (max-width:560px){.tbtn{width:22px;height:22px;font-size:.75rem}.collage{gap:6px}.tile{border-width:3px}}
.collage-frame .pf-bloom{position:absolute;width:64px;pointer-events:none;z-index:3}
.collage-frame .tl{left:-14px;top:-14px}.collage-frame .br{right:-14px;bottom:-14px;transform:rotate(180deg)}
.backup{display:flex;gap:6px;margin-top:6px}
[hidden]{display:none!important}
</style>

</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Petal Planner</h1>
      <div class="sub">No dates or year, so you can start in any year. Pick a month below.</div>

/* ---------- money ---------- */
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
const fmt=n=>n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

  const m=M(), mo=m.money;
  p.append(el("div",{class:"head"},monthHeader("Income, spending & bills"),el("div",{class:"sub"},"Amounts in your own currency.")));
  const totWrap=el("div",{class:"totals"});
  function totals(){
    const inc=mo.income.reduce((s,r)=>s+num(r.a),0),sp=mo.spend.reduce((s,r)=>s+num(r.a),0),bl=mo.bills.reduce((s,r)=>s+num(r.a),0),left=inc-sp-bl;
    const unpaid=mo.bills.filter(b=>!b.paid).reduce((s,r)=>s+num(r.a),0);

      el("div",{class:"tot"},el("span",{class:"mini"},"Income"),el("b",{},fmt(inc))),
      el("div",{class:"tot"},el("span",{class:"mini"},"Spending"),el("b",{},fmt(sp))),
      el("div",{class:"tot"},el("span",{class:"mini"},"Bills · "+fmt(unpaid)+" unpaid"),el("b",{},fmt(bl))),
      el("div",{class:"tot"+(left<0?" neg":"")},el("span",{class:"mini"},"Left over"),el("b",{},fmt(left))));

        const rm=el("button",{class:"x","aria-label":"Remove",onclick:()=>{mo[key].splice(i,1);draw();touch();totals()}},"×");
        if(bill){
          const cb=el("input",{type:"checkbox",class:"check",id:key+"p"+i,"aria-label":"Paid",checked:r.paid});cb.onchange=()=>{r.paid=cb.checked;touch();totals()};
          const due=el("input",{type:"text",inputmode:"numeric",id:key+"d"+i,value:r.due||"",placeholder:"Due","aria-label":"Due day"});due.oninput=()=>{r.due=due.value;touch()};
          list.append(el("div",{class:"mrow bill"},cb,n,due,a,rm));

      });
    }
    draw();
    const add=el("button",{class:"btn ghost small",onclick:()=>{mo[key].push(bill?{n:"",a:"",due:"",paid:false}:{n:"",a:""});draw();touch();list.querySelectorAll("input[type=text]")[bill?mo[key].length*2-2:mo[key].length*2-2]?.focus()}},"+ Add");
    return el("div",{class:"card"},el("div",{class:"colhead"},el("h3",{},title),sum),bill?el("div",{class:"mini"},"Tick when paid · due day"):null,list,el("div",{},add));
  }

  totals();

/* ---------- fitness ---------- */
function renderFit(p){

  const count=()=>Object.values(f.days).filter(d=>d.done).length;
  p.append(el("div",{class:"head"},monthHeader("Exercise & fitness tracker"),el("div",{class:"sub"},"Tick each day you moved. Add the activity and minutes if you like.")));
  const goal=el("input",{type:"number",id:"fgoal",min:1,max:31,value:f.goal,style:"width:70px"});

    const put=()=>{f.days[d]={done:cb.checked,type:act.value,mins:mins.value};if(!cb.checked&&!act.value&&!mins.value)delete f.days[d];box.classList.toggle("on",cb.checked);touch();upd()};

  const left=el("div",{},el("div",{class:"row",style:"align-items:center;justify-content:space-between;margin-bottom:8px"},stat,el("label",{class:"controls"},"Monthly goal",goal,"days")),bar,el("div",{style:"height:14px"}),g);
  const right=el("div",{class:"reward"},el("h3",{},"Rewards for showing up"),el("div",{class:"sub"},"Each one lights up when you reach that many active days."),ms,
    el("div",{class:"eyebrow"},"Simple reward ideas"),el("div",{class:"ideas"},...FIT_REWARDS.map(x=>el("button",{onclick:()=>{const i=f.rewards.findIndex(r=>!r.r);const k=i<0?f.rewards.length-1:i;f.rewards[k].r=x;touch();render()}},x))));

async function exportData(){
  const all=await idbAll();const blob=new Blob([JSON.stringify({app:"petal-to-the-metal",v:1,data:all})],{type:"application/json"});
  const f=new File([blob],"petal-planner-backup.json",{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Planner backup"});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;document.body.append(a);a.click();a.remove();
}
